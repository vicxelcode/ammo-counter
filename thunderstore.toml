# Paquete de Thunderstore. Fuente única de nombre, versión, dependencias y categorías:
# scripts/package.sh lo construye con tcli y scripts/publish.sh lo sube.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "vicxelcode"
name = "AmmoCounter"
versionNumber = "1.0.0"
description = "Shows the shots left as a number on every inventory slot and next to the gun in your hand. Works with extra slots from other mods."
websiteUrl = "https://github.com/vicxelcode/ammo-counter"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./dist"

[[build.copy]]
source = "./bin/Release/AmmoCounter.dll"
target = "AmmoCounter.dll"

[[build.copy]]
source = "./CHANGELOG.md"
target = "CHANGELOG.md"

[publish]
repository = "https://thunderstore.io"
communities = ["repo"]

[publish.categories]
repo = ["clientside", "quality-of-life", "items"]
